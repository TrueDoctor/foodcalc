[package]
name = "app"
version = "0.1.0"
edition = "2024"

[features]
default = []
typst = ["dep:typst-renderer"]

[dependencies]
foodlib_new = { path = "../foodlib_new", features = ["axum"] }
typst-renderer = { path = "../typst-renderer", optional = true }
bigdecimal.workspace = true

serde = { version = "1.0.229", features = ["derive"] }
tokio = "1.54.1"
time = "0.3.37"
serde_json = "1.0.138"
log = "0.4.35"
